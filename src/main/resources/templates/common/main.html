<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어바웃컨설팅</title>
    <th:block th:replace="~{/common/fragment :: library}"></th:block>
    <link rel="stylesheet" th:href="@{/css/common/main.css}">
</head>

<body>

    <div class="main-wrapper">

        <!-- 로고 영역 -->
        <div class="logo-area">
            <img th:src="@{/img/main-logo.png}" alt="어바웃컨설팅 로고" class="main-logo">
        </div>

        <!-- 닉네임 영역 (로그인 시) -->
        <div class="nickname-area" sec:authorize="isAuthenticated()">
            <a th:href="@{/member/myinfo}" class="nickname-link">
                <i data-lucide="circle-user-round" class="nickname-icon"></i>
                <span class="nickname-text" th:text="${#authentication.principal.nickname}">닉네임</span>
                <i data-lucide="chevron-right" class="nickname-arrow"></i>
            </a>
        </div>

        <!-- 메뉴 박스 영역 -->
        <div class="menu-grid">

            <!-- 비로그인 -->
            <div sec:authorize="isAnonymous()">
                <div class="menu-grid-inner col-2">
                    <a th:href="@{/member/login}" class="menu-card">
                        <i data-lucide="log-in" class="menu-icon"></i>
                        <span class="menu-label">로그인하기</span>
                    </a>
                    <a th:href="@{/member/join}" class="menu-card">
                        <i data-lucide="user-plus" class="menu-icon"></i>
                        <span class="menu-label">회원가입하기</span>
                    </a>
                </div>
            </div>

            <!-- ADMIN -->
            <div sec:authorize="hasRole('ADMIN')">
                <div class="menu-grid-inner col-2">
                    <a th:href="@{/consultant/list}" class="menu-card">
                        <i data-lucide="users" class="menu-icon"></i>
                        <span class="menu-label">컨설턴트 목록</span>
                    </a>
                    <a th:href="@{/consultant/register}" class="menu-card">
                        <i data-lucide="user-round-plus" class="menu-icon"></i>
                        <span class="menu-label">컨설턴트 등록</span>
                    </a>
                    <a th:href="@{/student/list}" class="menu-card">
                        <i data-lucide="graduation-cap" class="menu-icon"></i>
                        <span class="menu-label">학생 목록</span>
                    </a>
                    <a th:href="@{/student/register}" class="menu-card">
                        <i data-lucide="notebook-pen" class="menu-icon"></i>
                        <span class="menu-label">학생 등록</span>
                    </a>
                </div>
            </div>

            <!-- CONSULTANT -->
            <div sec:authorize="hasRole('CONSULTANT')">
                <div class="menu-grid-inner col-1">
                    <a th:href="@{/consultant/mystudent}" class="menu-card">
                        <i data-lucide="clipboard-list" class="menu-icon"></i>
                        <span class="menu-label">담당 학생 목록</span>
                    </a>
                </div>
            </div>

        </div>
        <!-- /menu-grid -->

    </div>

    <script th:src="@{/js/common/main.js}"></script>
</body>

</html>
