<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어바웃컨설팅</title>
    <th:block th:replace="~{/common/fragment :: library}"></th:block>
    <link rel="stylesheet" th:href="@{/css/common/main.css}">
</head>

<body>

    <div class="main-wrapper">

        <!-- 로고 영역 -->
        <div class="logo-area">
            <img th:src="@{/img/main-logo.png}" alt="어바웃컨설팅 로고" class="main-logo">
        </div>

        <!-- 닉네임 영역 (로그인 시) -->
        <div class="nickname-area" sec:authorize="isAuthenticated()">
            <a th:href="@{/member/myinfo}" class="nickname-link">
                <i data-lucide="circle-user-round"></i>
                <span sec:authentication="principal.nickname"></span>
                <span class="nickname-suffix">님</span>
            </a>
        </div>

        <!-- 메뉴 박스 영역 -->
        <div class="menu-grid">

            <!-- 비로그인 상태 -->
            <div sec:authorize="isAnonymous()">
                <div class="menu-box-row">
                    <a th:href="@{/member/login}" class="menu-box">
                        <i data-lucide="log-in"></i>
                        <span>로그인하기</span>
                    </a>
                    <a th:href="@{/member/join}" class="menu-box">
                        <i data-lucide="user-plus"></i>
                        <span>회원가입하기</span>
                    </a>
                </div>
            </div>

            <!-- ADMIN 권한 -->
            <div sec:authorize="hasRole('ADMIN')">
                <div class="menu-box-row menu-box-row--grid4">
                    <a th:href="@{/consultant/list}" class="menu-box">
                        <i data-lucide="users"></i>
                        <span>컨설턴트 목록</span>
                    </a>
                    <a th:href="@{/consultant/register}" class="menu-box">
                        <i data-lucide="user-round-plus"></i>
                        <span>컨설턴트 등록</span>
                    </a>
                    <a th:href="@{/student/list}" class="menu-box">
                        <i data-lucide="graduation-cap"></i>
                        <span>학생 목록</span>
                    </a>
                    <a th:href="@{/student/register}" class="menu-box">
                        <i data-lucide="notebook-pen"></i>
                        <span>학생 등록</span>
                    </a>
                </div>
            </div>

            <!-- CONSULTANT 권한 -->
            <div sec:authorize="hasRole('CONSULTANT')">
                <div class="menu-box-row">
                    <a th:href="@{/consultant/mystudent}" class="menu-box menu-box--single">
                        <i data-lucide="book-open-check"></i>
                        <span>담당 학생 목록</span>
                    </a>
                </div>
            </div>

        </div>
        <!-- /menu-grid -->

    </div>
    <!-- /main-wrapper -->

    <script th:src="@{/js/common/main.js}"></script>
</body>

</html>
