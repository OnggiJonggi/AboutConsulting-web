<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어바웃컨설팅</title>
    <th:block th:replace="~{common/fragment :: common}"></th:block>
    <link rel="stylesheet" th:href="@{/css/common/main.css}">
</head>

<body>

    <div class="main-wrapper">

        <!-- ── 로고 ── -->
        <div class="logo-wrap">
            <img th:src="@{/img/main-logo.png}" alt="어바웃컨설팅 로고" class="main-logo">
        </div>

        <!-- ── 상단 유저 정보 바 ── -->

        <!-- 비로그인: 빈 공간 -->
        <div sec:authorize="isAnonymous()" class="user-bar user-bar--empty"></div>

        <!-- 로그인한 사용자 전체에게 표시 -->
        <div sec:authorize="isAuthenticated()" class="user-bar">
            <div class="user-bar__inner">
                <div class="user-bar__left">
                    <a th:href="@{/member/myinfo}" class="user-nickname">
                        <i data-lucide="user-circle-2" class="icon-sm"></i>
                        <span sec:authentication="principal.nickname">닉네임</span>
                    </a>

                    <!-- 권한 -->
                    <span th:with="
                        role=${#authentication.principal.authorities[0].authority},
                        roleLabel=(
                            ${role == 'ROLE_SUPER_ADMIN'}   ? '최고 관리자' :
                            (${role == 'ROLE_ADMIN'}         ? '관리자' :
                            (${role == 'ROLE_CONSULTANT_LEADER'} ? '대표 컨설턴트' :
                            (${role == 'ROLE_CONSULTANT'}    ? '컨설턴트' :
                            (${role == 'ROLE_STUDENT'}       ? '학생' :
                            (${role == 'ROLE_VIEWER'}        ? '일반 회원' : ${role.replace('ROLE_', '')})))))),
                        roleClass=(
                            ${role == 'ROLE_SUPER_ADMIN'}   ? 'badge--super-admin' :
                            (${role == 'ROLE_ADMIN'}         ? 'badge--admin' :
                            (${role == 'ROLE_CONSULTANT_LEADER'} ? 'badge--consultant-leader' :
                            (${role == 'ROLE_CONSULTANT'}    ? 'badge--consultant' :
                            (${role == 'ROLE_STUDENT'}       ? 'badge--student' :
                            (${role == 'ROLE_VIEWER'}        ? 'badge--viewer' : ''))))))
                        " th:text="${roleLabel}" th:classappend="${roleClass}" class="badge">
                    </span>
                </div>

                <!-- 로그아웃 -->
                <form th:action="@{/member/logout}" method="post">
                    <button type="submit" class="btn-logout">
                        <i data-lucide="log-out" class="icon-sm"></i>
                        로그아웃
                    </button>
                </form>
            </div>
        </div>

        <!-- ── 메뉴 카드 영역 ── -->

        <!-- 비로그인: 로그인 / 회원가입 -->
        <div sec:authorize="isAnonymous()" class="card-grid">
            <a th:href="@{/member/login}" class="menu-card">
                <i data-lucide="log-in" class="menu-card__icon"></i>
                <span class="menu-card__label">로그인하기</span>
            </a>
            <a th:href="@{/member/join}" class="menu-card">
                <i data-lucide="user-plus" class="menu-card__icon"></i>
                <span class="menu-card__label">회원가입하기</span>
            </a>
        </div>

        <!-- ADMIN: 1행 - 회원 관리 -->
        <div sec:authorize="hasRole('ADMIN')" class="card-grid card-grid--2">
            <a th:href="@{/member}" class="menu-card">
                <i data-lucide="book-user" class="menu-card__icon"></i>
                <span class="menu-card__label">회원 목록</span>
            </a>
            <a th:href="@{/admin}" class="menu-card disabled-card">
                <i data-lucide="shield-check" class="menu-card__icon"></i>
                <span class="menu-card__label">관리자 페이지</span>
            </a>
        </div>

        <!-- ADMIN: 2행 - 학생 관리 -->
        <div sec:authorize="hasRole('ADMIN')" class="card-grid card-grid--2" style="margin-top: 1rem;">
            <a th:href="@{/student}" class="menu-card">
                <i data-lucide="graduation-cap" class="menu-card__icon"></i>
                <span class="menu-card__label">학생 목록</span>
            </a>
            <a th:href="@{/student/register}" class="menu-card">
                <i data-lucide="user-round-plus" class="menu-card__icon"></i>
                <span class="menu-card__label">학생 등록</span>
            </a>
        </div>

        <!-- ADMIN: 3행 - 컨설턴트 관리 -->
        <div sec:authorize="hasRole('ADMIN')" class="card-grid card-grid--2" style="margin-top: 1rem;">
            <a th:href="@{/consultant}" class="menu-card">
                <i data-lucide="users" class="menu-card__icon"></i>
                <span class="menu-card__label">컨설턴트 목록</span>
            </a>
            <a th:href="@{/consultant/charged}" class="menu-card">
                <i data-lucide="link" class="menu-card__icon"></i>
                <span class="menu-card__label">컨설턴트 - 학생 배정</span>
            </a>
        </div>

        <!-- ADMIN: 4행 - 소속 관리 -->
        <div sec:authorize="hasRole('ADMIN')" class="card-grid card-grid--3" style="margin-top: 1rem;">
            <a th:href="@{/org}" class="menu-card">
                <i data-lucide="building-2" class="menu-card__icon"></i>
                <span class="menu-card__label">컨설턴트 소속 목록</span>
            </a>
            <a th:href="@{/org/register}" class="menu-card">
                <i data-lucide="plus-circle" class="menu-card__icon"></i>
                <span class="menu-card__label">소속 생성</span>
            </a>
            <a th:href="@{/org/charged}" class="menu-card">
                <i data-lucide="git-merge" class="menu-card__icon"></i>
                <span class="menu-card__label">컨설턴트 - 소속 배정</span>
            </a>
        </div>

        <!-- CONSULTANT -->
        <div sec:authorize="hasRole('CONSULTANT')" class="card-grid">
            <a th:href="@{/consultant/myinfo}" class="menu-card">
                <i data-lucide="book-open-check" class="menu-card__icon"></i>
                <span class="menu-card__label">담당 학생 목록</span>
            </a>
            <a th:href="@{/org/myinfo}" class="menu-card">
                <i data-lucide="building-2" class="menu-card__icon"></i>
                <span class="menu-card__label">내 소속</span>
            </a>
        </div>

    </div>

    <script th:src="@{/js/common/main.js}"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
