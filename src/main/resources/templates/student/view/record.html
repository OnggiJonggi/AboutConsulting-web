<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

  <th:block th:fragment="content">

    <div class="record-root" id="record-root">

      <!-- ── 상단 바 (타이틀 + 분석 기록 버튼) ── -->
      <div class="record-topbar">
        <div class="record-topbar__title">
          <i data-lucide="book-open" class="icon-sm"></i>
          <span>생기부 분석</span>
        </div>
        <a th:href="@{/student/{no}/record/history(no=${encStudentNo})}" class="btn-outline-sm"
          id="record-btn-history">
          <i data-lucide="history" class="icon-sm"></i>
          분석 기록
        </a>
      </div>

      <!-- ── FAILED: 실패 알림 ── -->
      <div th:if="${studentRecord != null and studentRecord.status == 'FAILED'}"
        class="record-alert record-alert--danger" id="record-alert-failed">
        <i data-lucide="alert-circle" class="icon-sm"></i>
        <span>분석에 실패했습니다.<br>다시 업로드해주세요.</span>
      </div>

      <!-- ── EMPTY / FAILED: 업로드 카드 ── -->
      <div th:if="${studentRecord == null
                  or studentRecord.status == 'EMPTY'
                  or studentRecord.status == 'FAILED'}" class="record-upload-card" id="record-upload-card">
        <div class="record-upload-card__icon">
          <i data-lucide="file-up"></i>
        </div>
        <p class="record-upload-card__title">생활기록부 업로드</p>
        <p class="record-upload-card__desc">PDF 파일 (최대 5MB)</p>

        <!-- 파일 입력 (숨김) -->
        <input type="file" id="record-file-input" accept=".pdf,application/pdf" style="display:none;">

        <!-- 파일 선택 라벨 -->
        <label for="record-file-input" class="record-file-label" id="record-file-label">
          <i data-lucide="paperclip" class="icon-sm"></i>
          <span id="record-file-label-text">파일 선택</span>
        </label>

        <!-- 업로드 버튼 (파일 선택 후 노출) -->
        <button class="record-btn-upload" id="record-btn-upload" style="display:none;"
          th:data-no="${encStudentNo}">
          <i data-lucide="upload-cloud" class="icon-sm"></i>
          업로드하기
        </button>
        <p class="record-upload-card__err" id="record-upload-err" style="display:none;"></p>
      </div>

      <!-- ── READY / 업로드 직후: 분석 중 카드 ── -->
      <div th:if="${studentRecord != null and studentRecord.status == 'READY'}" class="record-pending-card"
        id="record-pending-card" th:style="'display:flex;'">
        <div class="record-pending-card__spinner" id="record-spinner"></div>
        <p class="record-pending-card__title">분석 중</p>
        <p class="record-pending-card__desc">몇 분 걸릴 수 있으니 기다려 주세요.</p>
      </div>

      <!-- ── 업로드 직후 동적으로 삽입되는 분석 중 카드 (초기 hidden) ── -->
      <div class="record-pending-card" id="record-pending-card-dynamic" style="display:none;">
        <div class="record-pending-card__spinner"></div>
        <p class="record-pending-card__title">분석 중</p>
        <p class="record-pending-card__desc">몇 분 걸릴 수 있으니 기다려 주세요.</p>
      </div>

      <!-- ── ACTIVE: 분석 결과 ── -->
      <div th:if="${studentRecord != null and studentRecord.status == 'ACTIVE'}" class="record-result"
        id="record-result">

        <div th:each="pair : ${studentRecord.analysisPair}" class="record-analysis-card">
          <div class="record-analysis-card__field">
            <i data-lucide="file-text" class="icon-sm"></i>
            <span th:text="${pair.field}">필드명</span>
          </div>
          <div class="record-analysis-card__body" th:text="${pair.analysis}">분석 내용</div>
        </div>

        <!-- 완료 시각 -->
        <div class="record-completed-at" id="record-completed-at">
          <i data-lucide="clock" class="icon-sm"></i>
          <span th:text="${#temporals.format(studentRecord.completedAt, 'yyyy년 MM월 dd일 hh:mm:ss')}">
            2025년 01월 01일 12:00:00
          </span>
        </div>

      </div>

    </div><!-- /record-root -->

    <!-- 숨겨진 데이터 전달용 -->
    <span id="record-enc-no" th:data-no="${encStudentNo}"
      th:data-status="${studentRecord != null ? studentRecord.status : 'EMPTY'}" style="display:none;"></span>

  </th:block>

</body>

</html>
