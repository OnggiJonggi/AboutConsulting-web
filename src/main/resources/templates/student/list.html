<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학생 목록</title>
  <th:block th:replace="~{/common/fragment :: common}"></th:block>
  <link rel="stylesheet" th:href="@{/css/student/list.css}">
</head>

<body>

  <div class="list-wrapper">

    <!-- ── 상단 헤더 영역 ── -->
    <div class="page-header">
      <a th:href="@{/}" class="logo-link">
        <img th:src="@{/img/main-logo.png}" alt="어바웃컨설팅 로고" class="header-logo">
      </a>
      <h1 class="page-title">
        <i data-lucide="graduation-cap" class="title-icon"></i>
        학생 목록
      </h1>
    </div>

    <!-- ── 메인 컨텐츠 영역 (필터 + 결과) ── -->
    <div class="content-area">

      <!-- ── 왼쪽: 필터 영역 ── -->
      <aside class="filter-panel">
        <div class="filter-header">
          <i data-lucide="sliders-horizontal" class="filter-header__icon"></i>
          <span>검색 필터</span>
        </div>

        <form id="searchForm" autocomplete="off">

          <!-- 학생 이름 -->
          <div class="filter-group">
            <label class="filter-label" for="f-name">
              <i data-lucide="user" class="label-icon"></i>학생 이름
            </label>
            <input type="text" id="f-name" name="name" class="filter-input" placeholder="이름 입력"
              th:value="${studentSearch.name}">
          </div>

          <!-- 학년 -->
          <div class="filter-group">
            <label class="filter-label">
              <i data-lucide="layers" class="label-icon"></i>학년
            </label>
            <div class="btn-group-radio" id="gradeGroup">
              <button type="button" class="radio-btn" data-name="grade" data-value="">전체</button>
              <button type="button" class="radio-btn" data-name="grade" data-value="1">1학년</button>
              <button type="button" class="radio-btn" data-name="grade" data-value="2">2학년</button>
              <button type="button" class="radio-btn" data-name="grade" data-value="3">3학년</button>
            </div>
            <input type="hidden" id="f-grade" name="grade"
              th:value="${studentSearch.grade != 0 ? studentSearch.grade : ''}">
          </div>

          <!-- 학기 -->
          <div class="filter-group">
            <label class="filter-label">
              <i data-lucide="calendar" class="label-icon"></i>학기
            </label>
            <div class="btn-group-radio" id="semesterGroup">
              <button type="button" class="radio-btn" data-name="semester" data-value="">전체</button>
              <button type="button" class="radio-btn" data-name="semester" data-value="1">1학기</button>
              <button type="button" class="radio-btn" data-name="semester" data-value="2">2학기</button>
            </div>
            <input type="hidden" id="f-semester" name="semester"
              th:value="${studentSearch.semester != 0 ? studentSearch.semester : ''}">
          </div>

          <!-- 계열 -->
          <div class="filter-group">
            <label class="filter-label">
              <i data-lucide="book-open" class="label-icon"></i>계열
            </label>
            <div class="btn-group-radio" id="trackGroup">
              <button type="button" class="radio-btn" data-name="track" data-value="">전체</button>
              <button type="button" class="radio-btn" data-name="track" data-value="이과">이과</button>
              <button type="button" class="radio-btn" data-name="track" data-value="문과">문과</button>
              <button type="button" class="radio-btn" data-name="track" data-value="예체능">예체능</button>
            </div>
            <input type="hidden" id="f-track" name="track" th:value="${studentSearch.track}">
          </div>

          <!-- 학교 이름 -->
          <div class="filter-group">
            <label class="filter-label" for="f-schoolName">
              <i data-lucide="school" class="label-icon"></i>학교 이름
            </label>
            <input type="text" id="f-schoolName" name="schoolName" class="filter-input" placeholder="학교명 입력"
              th:value="${studentSearch.schoolName}">
          </div>

          <!-- 목표 대학 -->
          <div class="filter-group">
            <label class="filter-label" for="f-targetUniv">
              <i data-lucide="landmark" class="label-icon"></i>목표 대학
            </label>
            <input type="text" id="f-targetUniv" name="target.univ" class="filter-input" placeholder="대학명 입력"
              th:value="${studentSearch.target != null ? studentSearch.target.univ : ''}">
          </div>

          <!-- 목표 학과 -->
          <div class="filter-group">
            <label class="filter-label" for="f-targetMajor">
              <i data-lucide="flask-conical" class="label-icon"></i>목표 학과
            </label>
            <input type="text" id="f-targetMajor" name="target.major" class="filter-input" placeholder="학과명 입력"
              th:value="${studentSearch.target != null ? studentSearch.target.major : ''}">
          </div>

          <!-- 검색 버튼 -->
          <button type="button" id="searchBtn" class="btn-search">
            <i data-lucide="search" class="btn-icon"></i>
            검색
          </button>

        </form>
      </aside>

      <!-- ── 오른쪽: 결과 영역 ── -->
      <section class="result-panel">

        <!-- 결과 헤더 (총 검색 수) -->
        <div class="result-header">
          <span class="result-title">
            <i data-lucide="list" class="result-header__icon"></i>
            검색 결과
          </span>
          <span class="result-count">
            총 <strong id="totalCount" th:text="${studentList.totalCount}">0</strong>명
          </span>
        </div>

        <!-- 학생 카드 목록 -->
        <div id="studentList" class="student-list">

          <!-- 초기 서버 렌더링 (Thymeleaf) -->
          <th:block th:if="${studentList != null and !studentList.list.isEmpty()}">
            <div th:each="student : ${studentList.list}" class="student-card"
              th:attr="data-enc=${student.encryptedStudentNo}" onclick="goStudent(this)">

              <!-- 학생 기본 정보 -->
              <div class="student-main">
                <div class="student-name-row">
                  <i data-lucide="user-round" class="student-icon"></i>
                  <span class="student-name" th:text="${student.name}">이름</span>
                </div>
                <div class="student-meta">
                  <span class="meta-item">
                    <i data-lucide="school" class="meta-icon"></i>
                    <span th:text="${student.schoolName}">학교명</span>
                  </span>
                  <span class="meta-sep">|</span>
                  <span class="meta-item">
                    <i data-lucide="layers" class="meta-icon"></i>
                    <span th:text="${student.grade} + '학년'">1학년</span>
                  </span>
                  <span class="meta-sep">|</span>
                  <span class="meta-item">
                    <i data-lucide="calendar" class="meta-icon"></i>
                    <span th:text="${student.semester} + '학기'">1학기</span>
                  </span>
                  <span class="meta-sep">|</span>
                  <span class="meta-item">
                    <i data-lucide="book-open" class="meta-icon"></i>
                    <span th:text="${student.track}">계열</span>
                  </span>
                </div>
              </div>

              <!-- 지망 대학 정보 -->
              <div class="student-targets" th:if="${student.target != null and !student.target.isEmpty()}">
                <div th:each="t : ${student.target}" class="target-item">
                  <span class="target-rank" th:text="${t.ranking} + '지망'">1지망</span>
                  <i data-lucide="landmark" class="meta-icon"></i>
                  <span class="target-univ" th:text="${t.univ}">대학명</span>
                  <span class="meta-sep">|</span>
                  <i data-lucide="flask-conical" class="meta-icon"></i>
                  <span class="target-major" th:text="${t.major}">학과명</span>
                </div>
              </div>

            </div>
          </th:block>

          <!-- 결과 없음 -->
          <div th:if="${studentList == null or studentList.list.isEmpty()}" id="emptyMsg" class="empty-msg">
            <i data-lucide="search-x" class="empty-icon"></i>
            <p>검색 결과가 없습니다.</p>
          </div>

        </div>

        <!-- ── 페이징 영역 ── -->
        <div class="pagination-area" id="paginationArea" th:if="${studentList != null and studentList.totalPage > 0}">

          <div class="pagination">

            <!-- 이전 블록 버튼 -->
            <button type="button" class="page-nav" id="prevBlock"
              th:classappend="${studentList.hasPrev} ? '' : 'hidden'" th:attr="data-page=${studentList.startPage - 1}">
              <i data-lucide="chevron-left"></i>
            </button>

            <!-- 페이지 번호 버튼들 -->
            <div id="pageNumbers" class="page-numbers">
              <th:block th:each="p : ${#numbers.sequence(studentList.startPage, studentList.endPage)}">
                <button type="button" class="page-num" th:classappend="${p == studentSearch.page} ? ' active' : ''"
                  th:text="${p}" th:attr="data-page=${p}">1</button>
              </th:block>
            </div>

            <!-- 다음 블록 버튼 -->
            <button type="button" class="page-nav" id="nextBlock"
              th:classappend="${studentList.hasNext} ? '' : 'hidden'" th:attr="data-page=${studentList.endPage + 1}">
              <i data-lucide="chevron-right"></i>
            </button>

          </div>
        </div>

      </section>
    </div>
  </div>

  <script th:src="@{/js/student/list.js}"></script>
  <script>lucide.createIcons();</script>
  <script>
    function goStudent(el) {
      const enc = el.getAttribute('data-enc');
      location.href = '/student/' + enc;
    }
  </script>
</body>

</html>
