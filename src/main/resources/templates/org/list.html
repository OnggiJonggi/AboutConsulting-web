<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소속 목록</title>
  <th:block th:replace="~{/common/fragment :: common}"></th:block>
  <link rel="stylesheet" th:href="@{/css/org/list.css}">
</head>

<body>

  <div class="list-wrapper">

    <!-- ── 상단 헤더 영역 ── -->
    <div class="page-header">
      <a th:href="@{/}" class="logo-link">
        <img th:src="@{/img/main-logo.png}" alt="어바웃컨설팅 로고" class="header-logo">
      </a>
      <h1 class="page-title">
        <i data-lucide="building-2" class="title-icon"></i>
        소속 목록
      </h1>
    </div>

    <!-- ── 메인 컨텐츠 영역 (필터 + 결과) ── -->
    <div class="content-area">

      <!-- ── 왼쪽: 필터 영역 ── -->
      <aside class="filter-panel">
        <div class="filter-header">
          <i data-lucide="sliders-horizontal" class="filter-header__icon"></i>
          <span>검색 필터</span>
        </div>

        <form id="searchForm" autocomplete="off">

          <!-- 소속명 -->
          <div class="filter-group">
            <label class="filter-label" for="f-name">
              <i data-lucide="building-2" class="label-icon"></i>소속명
            </label>
            <input type="text" id="f-name" name="name" class="filter-input" placeholder="소속명 입력"
              th:value="${orgSearch.name}">
          </div>

          <!-- 상태 -->
          <div class="filter-group">
            <label class="filter-label">
              <i data-lucide="shield-check" class="label-icon"></i>상태
            </label>
            <div class="btn-group-radio" id="statusGroup">
              <button type="button" class="radio-btn" data-name="status" data-value="">전체</button>
              <button type="button" class="radio-btn status-active" data-name="status" data-value="ACTIVE">정상</button>
              <button type="button" class="radio-btn status-suspended" data-name="status"
                data-value="SUSPENDED">정지</button>
              <button type="button" class="radio-btn status-deleted" data-name="status" data-value="DELETED">삭제</button>
            </div>
            <input type="hidden" id="f-status" name="status"
              th:value="${orgSearch.status != null ? orgSearch.status : ''}">
          </div>

          <!-- 컨설턴트 별명 -->
          <div class="filter-group">
            <label class="filter-label" for="f-consultantNickname">
              <i data-lucide="at-sign" class="label-icon"></i>컨설턴트 별명
            </label>
            <input type="text" id="f-consultantNickname" name="consultantNickname" class="filter-input"
              placeholder="별명 입력" th:value="${orgSearch.consultantNickname}">
          </div>

          <!-- 컨설턴트 이름 -->
          <div class="filter-group">
            <label class="filter-label" for="f-consultantName">
              <i data-lucide="user" class="label-icon"></i>컨설턴트 이름
            </label>
            <input type="text" id="f-consultantName" name="consultantName" class="filter-input" placeholder="이름 입력"
              th:value="${orgSearch.consultantName}">
          </div>

          <!-- 검색 버튼 -->
          <button type="button" id="searchBtn" class="btn-search">
            <i data-lucide="search" class="btn-icon"></i>
            검색
          </button>

        </form>
      </aside>

      <!-- ── 오른쪽: 결과 영역 ── -->
      <section class="result-panel">

        <!-- 결과 헤더 -->
        <div class="result-header">
          <span class="result-title">
            <i data-lucide="list" class="result-header__icon"></i>
            검색 결과
          </span>
          <span class="result-count">
            총 <strong id="totalCount" th:text="${orgList.totalCount}">0</strong>개
          </span>
        </div>

        <!-- 소속 카드 목록 -->
        <div id="orgList" class="org-list">

          <!-- 초기 서버 렌더링 (Thymeleaf) -->
          <th:block th:if="${orgList != null and !orgList.list.isEmpty()}">
            <div th:each="org : ${orgList.list}" class="org-card" th:attr="data-enc=${org.encOrgNo}">

              <!-- 1행: 소속명, 대표 컨설턴트 별명 -->
              <div class="card-row card-row--primary">
                <span class="card-org-name">
                  <i data-lucide="building-2" class="card-icon"></i>
                  <span th:text="${org.name}">소속명</span>
                </span>
                <span class="card-leader">
                  <i data-lucide="crown" class="card-icon-sm"></i>
                  <span th:text="${org.leaderNickname != null ? org.leaderNickname : '-'}">대표</span>
                </span>
              </div>

              <!-- 2행: 컨설턴트 수, 학생 수 총합, 상태 -->
              <div class="card-row card-row--secondary">
                <span class="card-stat" title="소속 컨설턴트 수">
                  <i data-lucide="users" class="meta-icon"></i>
                  <span th:text="${org.consultantCount}">0</span>
                </span>
                <span class="card-stat" title="전체 담당 학생 수">
                  <i data-lucide="graduation-cap" class="meta-icon"></i>
                  <span th:text="${org.studentCount}">0</span>
                </span>
                <span class="status-badge"
                  th:classappend="${org.status.name() == 'ACTIVE'} ? ' status-badge--active' :
                                  (${org.status.name() == 'SUSPENDED'} ? ' status-badge--suspended' : ' status-badge--deleted')" th:text="${org.status.name() == 'ACTIVE'} ? '정상' :
                           (${org.status.name() == 'SUSPENDED'} ? '정지' : '삭제')">상태</span>
              </div>

            </div>
          </th:block>

          <!-- 결과 없음 -->
          <div th:if="${orgList == null or orgList.list.isEmpty()}" id="emptyMsg" class="empty-msg">
            <i data-lucide="search-x" class="empty-icon"></i>
            <p>검색 결과가 없습니다.</p>
          </div>

        </div>

        <!-- ── 페이징 영역 ── -->
        <div class="pagination-area" id="paginationArea" th:if="${orgList != null and orgList.totalPage > 0}">
          <div class="pagination">

            <!-- 이전 블록 버튼 -->
            <button type="button" class="page-nav" id="prevBlock" th:classappend="${orgList.hasPrev} ? '' : 'hidden'"
              th:attr="data-page=${orgList.startPage - 1}">
              <i data-lucide="chevron-left"></i>
            </button>

            <!-- 페이지 번호 버튼들 -->
            <div id="pageNumbers" class="page-numbers">
              <th:block th:each="p : ${#numbers.sequence(orgList.startPage, orgList.endPage)}">
                <button type="button" class="page-num" th:classappend="${p == orgSearch.page} ? ' active' : ''"
                  th:text="${p}" th:attr="data-page=${p}">1</button>
              </th:block>
            </div>

            <!-- 다음 블록 버튼 -->
            <button type="button" class="page-nav" id="nextBlock" th:classappend="${orgList.hasNext} ? '' : 'hidden'"
              th:attr="data-page=${orgList.endPage + 1}">
              <i data-lucide="chevron-right"></i>
            </button>

          </div>
        </div>

      </section>
    </div>
  </div>

  <script th:src="@{/js/org/list.js}"></script>
  <script>
    lucide.createIcons();

    document.querySelectorAll('.org-card').forEach(function (card) {
      card.addEventListener('click', function () {
        var enc = card.getAttribute('data-enc');
        if (enc) location.href = '/org/' + enc;
      });
    });
  </script>
</body>

</html>
